name: Eneba price check

on:
  schedule:
    - cron: "0 0,12 * * *"   # every 12 hours (03:00 and 15:00 Israel time, summer)
  workflow_dispatch:          # "Run workflow" button for a manual test

permissions:
  contents: write             # push run history to the "data" branch

concurrency:
  group: eneba-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check price
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THRESHOLD: ${{ vars.THRESHOLD }}
          ENEBA_FEE: ${{ vars.ENEBA_FEE }}
          PRODUCT_URL: ${{ vars.PRODUCT_URL }}
          ALWAYS_NOTIFY: ${{ vars.ALWAYS_NOTIFY }}
        run: python eneba_bot.py

      # Appends this run's result to eneba_history.jsonl on the "data" branch
      # (read by the local dashboard). Keeps the last 30 days.
      - name: Save history
        if: always()
        run: |
          [ -f data/eneba_history.jsonl ] || exit 0
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin data >/dev/null; then
            git fetch --depth 1 origin data
            git worktree add --detach /tmp/history FETCH_HEAD
          else
            git worktree add --detach /tmp/history
            git -C /tmp/history checkout --orphan data
            git -C /tmp/history rm -rfq .
          fi
          cat data/eneba_history.jsonl >> /tmp/history/eneba_history.jsonl
          python -c "import botlib; botlib.prune_file('/tmp/history/eneba_history.jsonl', 30)"
          git -C /tmp/history add eneba_history.jsonl
          git -C /tmp/history commit -qm "Eneba run ${{ github.run_id }}"
          git -C /tmp/history push -q origin HEAD:data
